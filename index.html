<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SNOWY BALLS</title>
  <meta name="theme-color" content="#2b3a55" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SNOWY BALLS" />
  <link rel="manifest" href="manifest.json" />
  <!-- TODO: real icons from the assets/ui texture pass - see docs/NOTES.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #14192a;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Press Start 2P", monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Game sits at the top of the page - not vertically centered/fullscreen anymore. */
    #game-container {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 426 / 243;
      touch-action: manipulation;
    }

    #game-container canvas {
      image-rendering: pixelated;
      display: block;
    }

    /* All in-game text lives here now instead of as blurry upscaled Phaser canvas text -
       a real web font at native resolution reads far more crisply than pixel-doubled bitmap
       text does at this canvas's small internal resolution. */
    #message {
      width: 100%;
      max-width: 640px;
      box-sizing: border-box;
      padding: 16px 20px;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      white-space: pre-line;
      min-height: 2.6em; /* reserves space so the page doesn't jump between messages */
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="message"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/economy.js?v=1"></script>
  <script src="src/main.js?v=18"></script>
</body>
</html>
