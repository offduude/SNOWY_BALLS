<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SNOWY BALLS</title>
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SNOWY BALLS" />
  <link rel="manifest" href="manifest.json" />
  <!-- TODO: real icons from the assets/ui texture pass - see docs/NOTES.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Press Start 2P", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fills the page - as wide as the viewport allows, capped so it never taller than the
       viewport either (min() of both), aspect ratio always preserved. */
    #game-container {
      position: relative;
      width: min(100vw, calc(100vh * 426 / 243));
      aspect-ratio: 426 / 243;
      touch-action: manipulation;
    }

    #game-container canvas {
      image-rendering: pixelated;
      display: block;
    }

    /* All in-game text lives here now instead of as blurry upscaled Phaser canvas text - a
       real web font at native resolution reads far more crisply than pixel-doubled bitmap text
       does at this canvas's small internal resolution. Centered back over the game screen
       (its original spot as a Phaser Text object) rather than living below the canvas. */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      white-space: pre-line;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.85);
      pointer-events: none; /* sits on top of the canvas - taps must still reach the game below */
      z-index: 2;
    }

    /* Mute toggle, top-right of the game. Plain <img>-as-button since it's just an icon, no
       label needed. */
    #volume-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 3;
      -webkit-tap-highlight-color: transparent;
    }

    #volume-btn img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
      filter: none;
      opacity: 1;
      transition: filter 0.15s ease, opacity 0.15s ease;
    }

    #volume-btn.muted img {
      filter: grayscale(100%);
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="message"></div>
    <button id="volume-btn" type="button" aria-label="Mute">
      <img src="assets/ui/volume_icon.png" alt="" />
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/economy.js?v=1"></script>
  <script src="src/main.js?v=26"></script>
  <script>
    // Toggles Phaser's global sound mute - waits for the game to exist since this can fire
    // before Phaser finishes booting on a slow load.
    document.getElementById("volume-btn").addEventListener("click", () => {
      const game = window.snowyBallsGame;
      if (!game) return;
      const nowMuted = !game.sound.mute;
      game.sound.mute = nowMuted;
      document.getElementById("volume-btn").classList.toggle("muted", nowMuted);
    });
  </script>
</body>
</html>
