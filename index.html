<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SNOWY BALLS</title>
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SNOWY BALLS" />
  <link rel="manifest" href="manifest.json" />
  <!-- TODO: real icons from the assets/ui texture pass - see docs/NOTES.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Press Start 2P", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fills the page - as wide as the viewport allows, capped so it never taller than the
       viewport either (min() of both), aspect ratio always preserved. */
    #game-container {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      width: min(100vw, calc(100dvh * 16 / 9)); /* dvh: mobile browser bars don't push it off-screen */
      aspect-ratio: 16 / 9;
      overflow: hidden; /* nothing (buttons included) can poke outside the display */
      touch-action: manipulation;
    }

    #game-container canvas {
      image-rendering: pixelated;
      display: block;
      width: 100% !important; /* the container defines the 16:9 box; overrides any inline size */
      height: 100% !important;
    }

    /* All in-game text lives here now instead of as blurry upscaled Phaser canvas text - a
       real web font at native resolution reads far more crisply than pixel-doubled bitmap text
       does at this canvas's small internal resolution. Centered back over the game screen
       (its original spot as a Phaser Text object) rather than living below the canvas. */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      /* The FIRST line (HIT / MISS / TAP to AIM ...) is centred on the middle of the screen (half a line up = 0.9em);
         whatever else the message says (+N coins, Saved Projectile, the countdown) hangs below it. */
      transform: translate(-50%, -0.9em);
      width: 90%;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      white-space: pre-line;
      /* thin black outline (8 hard 1px shadows) so it reads on any background - all middle text has it */
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
        0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000;
      pointer-events: none; /* sits on top of the canvas - taps must still reach the game below */
      z-index: 2;
    }

    /* (The mute button that was here is gone: the volume is a slider in OPTIONS now. Its picture, assets/ui/volume_icon.png, is kept in the files.) */

    /* Shop screen: shop_board.png stretched over the whole game display (canvas + message),
       faded in/out. Sits under the SHOP/BACK button (z 4). */
    /* The corkboard look, freed up from the SHOP tab for the BOXES feature (2026-09-27) - see the body markup's
       comment. Gated by .boxes-open, which nothing sets yet (no BOXES button exists until that feature lands). */
    #boxes-board {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      will-change: opacity; /* own layer from the start, so the fade doesn't create one mid-click */
      z-index: 3;
    }

    #game-container.boxes-open #boxes-board {
      opacity: 1;
      pointer-events: auto; /* swallows taps so they can't reach the game underneath */
    }

    /* --u = 1% of the display width, so shop text scales with the game on any screen. */
    #game-container {
      --u: calc(min(100vw, 100vh * 16 / 9) / 100);
      --u: calc(min(100vw, 100dvh * 16 / 9) / 100);
    }

    /* Items pinned on the cork part of shop_board.png (cork is ~9%-91% across, ~9%-90% down). */
    #boxes-items {
      position: absolute;
      left: 9%;
      top: 9%;
      width: 82%;
      height: 81%;
      box-sizing: border-box;
      padding: calc(var(--u) * 1.2);
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1.6);
      font-family: "Press Start 2P", monospace;
      color: #3b2412;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      will-change: opacity;
      z-index: 3;
    }

    #game-container.boxes-open #boxes-items {
      opacity: 1;
      pointer-events: auto;
    }

    /* HOLD to INSPECT: under the cork board, in the style of the game's own "TAP to AIM" (#message) - same look,
       same convention the old shop had before it became a plain list (2026-09-27: BOXES inherited it instead). */
    #boxes-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2.4%;
      text-align: center;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 12px;
      line-height: 1.8;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
        0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 4;
    }

    #game-container.boxes-open #boxes-hint { opacity: 1; }

    @media (pointer: coarse), (max-width: 700px) {
      #boxes-hint { font-size: 9px; }
    }

    /* The odds grid (boxes.js openInspect): a dimmed backdrop over the boxes screen with just each possible
       item's picture and its chance% - no other text at all (the owner's ask), captioned in the exact same
       white/black-outline style as #boxes-hint/#message above, not a card of its own. A "TAP to INSPECT" caption
       (same style again) sits below the rectangle, telling them what tapping a picture does. */
    #boxes-inspect {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 1.6);
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 6;
    }

    #game-container.boxes-open #boxes-inspect.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* A rectangle that scales with however many items are in the box, not a fixed shape - boxes.js sets
       grid-template-columns inline (roughly ceil(sqrt(count)) columns) so it reads as one deliberate block
       instead of a loose wrapped row. */
    #boxes-inspect-grid {
      display: grid;
      gap: calc(var(--u) * 1.8);
      justify-content: center;
    }

    .box-inspect-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--u) * 0.5);
      width: calc(var(--u) * 10);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .box-inspect-cell img {
      width: 100%;
      height: calc(var(--u) * 10);
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .box-inspect-chance,
    #boxes-inspect-caption {
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
        0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000;
    }

    .box-inspect-chance {
      font-size: calc(var(--u) * 1.1);
    }

    #boxes-inspect-caption {
      font-size: calc(var(--u) * 1.3);
      pointer-events: none;
    }

    /* One item's own card, tapped from the odds grid above - the exact same look the SKINS menu uses
       (Collection.skinRowHtml), on top of the odds grid rather than replacing it. */
    #boxes-inspect-item {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 7; /* above #boxes-inspect (6) */
    }

    #game-container.boxes-open #boxes-inspect-item.show {
      opacity: 1;
      pointer-events: auto;
    }

    #boxes-inspect-item-card {
      width: 52%;
      font-family: "Press Start 2P", monospace;
      color: #3b2412;
    }

    #boxes-inspect-item-card .pick-row {
      box-sizing: border-box;
      height: calc(var(--u) * 14);
      min-height: 0;
      overflow: hidden;
    }

    .box-owned-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #8a6a44;
      font-size: calc(var(--u) * 0.9);
    }

    /* BOXES (2026-09-27): bright colour buttons instead of the shop's old pinned-leaflet look - no category
       label, box.png as the closed-box picture, price centered under the name. Shares the 3x2 .shop-grid layout
       the corkboard already provides (see #boxes-items above). */
    .box-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 0.5);
      min-width: 0;
      min-height: 0;
      padding: calc(var(--u) * 1) calc(var(--u) * 0.6);
      border: none;
      border-radius: 14px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      color: #ffffff;
      font-family: inherit;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, opacity 0.2s ease;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35);
    }

    .box-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
    /* Unaffordable: the button STAYS bright (the owner likes the colourful look, didn't want it dimmed) - just
       the price itself turns red, with the same black outline every box's white text already has for contrast
       against all three background colours. */
    .box-btn.cant .box-price { color: #ff5252; text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000; }
    .box-btn.shake { animation: shop-shake 0.3s linear; }

    .box-btn.box-soon {
      background: #7a6a58;
      color: #d9c9a8;
      cursor: default;
      box-shadow: none;
      text-shadow: none;
    }

    .box-pic {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      align-self: stretch;
    }

    .box-pic img {
      width: 55%;
      height: 55%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3));
    }

    .box-name {
      font-size: calc(var(--u) * 1.3);
    }

    .box-price {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 0.5);
      font-size: calc(var(--u) * 1.4);
    }

    .box-price .coin {
      display: inline-block;
      width: calc(var(--u) * 1.4);
      height: calc(var(--u) * 1.4);
      background: #f1c40f;
      border: 2px solid #b8860b;
      border-radius: 50%;
      box-sizing: border-box;
    }

    /* The revealed item after a box opens: same bright card, its own rarity label at the top and picture/name in
       place of the box.png/price - picks up the shared legendary rainbow shine below via Rarity.cardClass. */
    .box-reveal-rarity {
      font-size: calc(var(--u) * 0.95);
      text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000;
    }

    .shop-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: calc(var(--u) * 2.4) calc(var(--u) * 2);
      min-height: 0;
    }

    .shop-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      min-width: 0;
      min-height: 0;
      padding: calc(var(--u) * 1.4) calc(var(--u) * 1.2) calc(var(--u) * 1);
      background: #f4ead0;
      border: 2px solid #7a5230;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.35);
      color: #3b2412;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, opacity 0.2s ease;
    }

    /* the pin */
    .shop-card::before {
      content: "";
      position: absolute;
      top: calc(var(--u) * -0.9);
      left: 50%;
      width: calc(var(--u) * 1.4);
      height: calc(var(--u) * 1.4);
      transform: translateX(-50%);
      background: #c0392b;
      border-radius: 50%;
      box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.4);
    }

    .shop-card:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
    .shop-card.empty { opacity: 0.55; cursor: default; justify-content: center; align-items: center; text-align: center; gap: calc(var(--u) * 1.2); }
    .shop-timer { font-size: calc(var(--u) * 1.8); }
    .shop-card.cant { opacity: 0.7; }
    .shop-card.cant .shop-price { color: #a3261c; }
    .shop-card.bought { opacity: 0; transform: scale(0.9); }
    .shop-card.shake { animation: shop-shake 0.3s linear; }

    @keyframes shop-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(calc(var(--u) * -0.6)); }
      75% { transform: translateX(calc(var(--u) * 0.6)); }
    }

    .shop-cat {
      font-size: calc(var(--u) * 0.95);
      color: #8a6a44;
      letter-spacing: 0.05em;
    }

    /* Top row of a shop card: PROJECTILE / BUFF at the left, the rarity at the right (same text style, its own colour). */
    .shop-top {
      align-self: stretch;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    /* Rarity labels are plain coloured text, no background; a thin dark outline keeps the light colours readable on the
       cream cards. */
    .shop-rarity,
    .pick-rarity {
      letter-spacing: 0.05em;
      text-shadow: 1px 0 #3b2412, -1px 0 #3b2412, 0 1px #3b2412, 0 -1px #3b2412;
    }

    .shop-rarity { font-size: calc(var(--u) * 0.95); }

    /* LEGENDARY: rainbow waves that keep travelling through the letters, plus a shine that pulses brighter and dimmer.
       (The text is a clipped gradient, so the outline and the glow are drop-shadow filters, not text-shadow.) */
    .rarity-rainbow {
      display: inline-block;
      text-shadow: none;
      background: linear-gradient(90deg, #ff4d4d, #ffa84d, #fff04d, #5bff6e, #4dd2ff, #6a6bff, #c14dff, #ff4d4d);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: rarity-wave 2.4s linear infinite, rarity-shine 1.7s ease-in-out infinite;
    }

    @keyframes rarity-wave {
      from { background-position: 0% 50%; }
      to { background-position: 200% 50%; }
    }

    @keyframes rarity-shine {
      0%, 100% {
        filter: drop-shadow(1px 0 0 #3b2412) drop-shadow(-1px 0 0 #3b2412) drop-shadow(0 1px 0 #3b2412) drop-shadow(0 -1px 0 #3b2412)
          drop-shadow(0 0 1px rgba(255, 255, 255, 0.15)) brightness(1);
      }
      50% {
        filter: drop-shadow(1px 0 0 #3b2412) drop-shadow(-1px 0 0 #3b2412) drop-shadow(0 1px 0 #3b2412) drop-shadow(0 -1px 0 #3b2412)
          drop-shadow(0 0 5px rgba(255, 255, 255, 0.95)) brightness(1.35);
      }
    }

    /* The SHOP tab (2026-09-27): a plain scrollable list of every projectile/buff (Collection.shopRowHtml rows),
       greyed out when not currently in the roll, instead of the old 3x2 grid of rolled slots - so a row already
       shows the full description, and there's no separate hold-to-inspect popup any more. Styled distinctly from
       #list-panel (a warm cream instead of solid brown) so it doesn't read as just another collection menu.
       PROJECTILES/BUFFS are a column beside the list (#shop-cats below), not tabs inside the panel any more - the
       owner's later call, so the column has obvious room to grow (more buttons, future seasons). */
    #shop-backdrop,
    #shop-panel,
    #shop-cats {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #shop-backdrop {
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 3;
    }

    #shop-panel {
      left: 15%;
      top: 12%;
      width: 56%;
      height: 76%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      background: #f4ead0;
      border: 2px solid #7a5230;
      border-radius: 4px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
      font-family: "Press Start 2P", monospace;
      color: #3b2412;
      z-index: 4;
    }

    #shop-cats {
      left: 73%;
      top: 12%;
      width: 17%;
      height: 76%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: calc(var(--u) * 1.6);
      z-index: 4;
    }

    #game-container.shop-open #shop-backdrop,
    #game-container.shop-open #shop-panel,
    #game-container.shop-open #shop-cats {
      opacity: 1;
      pointer-events: auto;
    }

    /* The gold header bar (vs #list-title's plain brown) is the shop's own visual signature - the coin price
       buttons throughout the list carry the same gold. The reroll countdown sits at its top-right (the owner's
       ask) - see shop.js updateTimerText. */
    #shop-header {
      flex: none;
      display: flex;
      align-items: baseline;
      justify-content: center;
      position: relative;
      padding: calc(var(--u) * 1.2) calc(var(--u) * 1.6);
      background: #d9a441;
      border-bottom: 2px solid #7a5230;
      color: #3b2412;
    }

    #shop-title {
      font-size: calc(var(--u) * 1.5);
    }

    #shop-timer {
      position: absolute;
      right: calc(var(--u) * 1.6);
      font-size: calc(var(--u) * 0.95);
      color: #5a3d1c;
    }

    .shop-cat-btn {
      width: 100%;
      height: 32px;
      padding: 0;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .shop-cat-btn.active {
      background: #74491f;
    }

    #shop-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1.2);
      padding: 8px calc(var(--u) * 1.2) calc(var(--u) * 1.2);
    }

    #shop-scroll::-webkit-scrollbar {
      display: none;
    }

    /* A row not currently in stock is only lightly dimmed (its picture/name/description stay fully readable -
       the owner didn't want the old heavier grayscale treatment); its BUY button always shows the item's real
       (fixed) price, just greyed out and disabled like an unaffordable one - see .pick-equip.shop-buy.cant below.
       There is no separate "NOT IN STOCK" label any more (2026-09-27, the owner's ask - one consistent look for
       "can't buy this right now", whatever the reason). */
    .shop-row.unavailable {
      opacity: 0.8;
    }

    /* "xN" left in this slot's offer for a stack currently on sale - replaces the old (removed 2026-09-27)
       per-item availability countdown in that same spot. */
    .shop-avail-row {
      font-size: calc(var(--u) * 0.85);
      color: #8a6a44;
      text-align: center;
      margin-top: calc(var(--u) * 0.3);
    }

    /* The buy button: the coin and the price (wider than EQUIP when the price needs it). */
    .pick-equip.shop-buy {
      width: auto;
      min-width: calc(var(--u) * (1.2 * 8 + 2.4) + 4px);
      padding-left: calc(var(--u) * 1);
      padding-right: calc(var(--u) * 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 0.7);
    }

    .pick-equip.shop-buy .coin {
      display: inline-block;
      width: calc(var(--u) * 1.4);
      height: calc(var(--u) * 1.4);
      background: #f1c40f;
      border: 2px solid #b8860b;
      border-radius: 50%;
      box-sizing: border-box;
    }

    /* Can't buy this right now - either too expensive or genuinely out of stock (see .shop-row.unavailable above):
       ONE consistent look for both, the button itself greys out rather than the price turning red (the owner's
       call, 2026-09-27 - didn't like the red-price-on-brown look). */
    .pick-equip.shop-buy.cant {
      background: #8a8a8a;
      border-color: #5a5a5a;
    }
    .pick-equip.shop-buy.cant .coin { filter: grayscale(1); }
    .pick-equip.shop-buy.shake { animation: shop-shake 0.3s linear; }

    /* A held-down picture must not open the browser's image menu (save / share): the pictures take no touches at all, nothing is selectable or draggable. */
    img { -webkit-touch-callout: none; -webkit-user-drag: none; user-select: none; }
    .shop-pic img, .pick-pic { pointer-events: none; }
    .shop-card, #shop-scroll { -webkit-touch-callout: none; }

    /* Space for the item's picture: takes whatever height is left between the category and the name. */
    .shop-pic {
      position: relative; /* the availability timer sits in its top-left corner */
      flex: 1;
      align-self: stretch;
      min-height: 0;
      /* The rectangle sits a little higher (0.15u under the category row instead of 0.5u; the 0.35u goes to the bottom, so it
         keeps its height) and the picture inside is a little smaller and lower (padding), clear of the availability timer. */
      margin: calc(var(--u) * 0.15) 0 calc(var(--u) * 0.85);
      padding: calc(var(--u) * 0.9) calc(var(--u) * 0.4) calc(var(--u) * 0.3);
      box-sizing: border-box;
      background: rgba(122, 82, 48, 0.1);
      border-radius: 2px;

    /* A projectile card is a grid: the picture on the left spanning both rows (so it stays centered on the card),
       the name/description and the EQUIP button on the first row, and the weight / hit value stats in ONE row along the
       bottom, starting right after the picture and running under the text and the button. */
    .pick-row.has-stats {
      /* Every projectile card is at least as tall as one with a 3-line description (12.97 units measured, padding and
         border included), so the EQUIP button (centred in the first row) is at the same height on every card. */
      box-sizing: border-box;
      min-height: calc(var(--u) * 13.05);
      display: grid;
      grid-template-rows: 1fr auto;
      grid-template-columns: auto minmax(0, 1fr) auto;
      column-gap: calc(var(--u) * 1.4);
      row-gap: calc(var(--u) * 0.9);
      align-items: center;
    }

    /* A buff card is as tall as a projectile card, so the length of its description never changes its height (a
       description of up to 3 lines fits; the USE button / timer is centred, i.e. where EQUIP is on a projectile). */
    .pick-row.buff-row {
      box-sizing: border-box;
      min-height: calc(var(--u) * 13.05);
    }

    .pick-row.buff-row .pick-regen {

      right: 0;
      transform: none;
      display: flex;
      justify-content: space-between;
    }

    /* A card with a bottom line keeps room for it under the text: the detail is drawn over the bottom of the card, so without this a long
       name (2 lines) plus a long description (3 lines) ran into it (Salt / Cheese Triangles). The card is as tall as before when the text is
       short (min-height above) and grows only when the text needs more. */
    .pick-row.buff-row.buff-detail {
      padding-bottom: calc(var(--u) * 3.1);
    }

    .pick-row.buff-row .pick-stats {

      left: calc(var(--u) * 11.6 + 2px);
      bottom: calc(var(--u) * 1.2);
    }

    .pick-row.has-stats .pick-pic { grid-column: 1; grid-row: 1 / span 2; }
    .pick-row.has-stats .pick-text { grid-column: 2; grid-row: 1; align-self: start; }
    .pick-row.has-stats .pick-action { grid-column: 3; grid-row: 1; }
    .pick-row.has-stats .pick-stats { grid-column: 2 / 4; grid-row: 2; }

    /* Two fixed columns: the left one is as wide as the longest weight word ("weight: very heavy" = 18 characters, one

    .pick-stats {

      grid-template-columns: calc(var(--u) * 19.5) auto;

      height: calc(var(--u) * 1.1);

         its centre 0.55em above the baseline when it stands on the baseline - so the number lines up with the coin. */
      vertical-align: baseline;
    }

    .pick-row {
      position: relative; /* the amount is placed in its top-right corner */
      flex: none;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 1.4);

    #game-container.shop-open #buff-hud,

      animation: ammo-saved-flash 0.5s ease-out;
    }

    @keyframes ammo-saved-flash {
      0% { border-color: #4a2f14; }
      25% { border-color: #ffffff; }
      100% { border-color: #4a2f14; }
    }

    #ammo-text { text-shadow: 1px 1px 0 #3b2412; } /* readable on the lighter rarity colours */

    /* The equipped projectile's picture and how many are left ("[picture] x12"), where the STREAK counter was. */
    #ammo-box img {
      width: 14px;
      height: 14px;
      margin-right: 4px;
      image-rendering: pixelated;
    }

    #game-container.shop-open #buffs-btn,
    #game-container.boxes-open #buffs-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* The running timer sits exactly where the USE / EQUIP button is (same width), so nothing shifts when a button
       turns into a timer. */
    .pick-timer {
      flex: none;
      box-sizing: border-box;
      width: calc(var(--u) * (1.2 * 8 + 2.4) + 4px);
      text-align: center;
      /* Exactly the height of the USE button (padding 1u + border 2px + a 1.2u line), so the max time under it ("03:00")
         is at the same place whether the buff is running or not. */
      padding: calc(var(--u) * 1) 0;
      border: 2px solid transparent;
      line-height: calc(var(--u) * 1.2);
      font-size: calc(var(--u) * 1.5);
      color: #3b2412;
    }

    /* "More coming soon!" under the last card of the CHARACTERS / SCENERIES menus */
    .list-soon {
      flex: none;
      padding: calc(var(--u) * 0.6) 0 calc(var(--u) * 0.4);
      text-align: center;
      font-size: calc(var(--u) * 1.1);
      color: #f4ead0;
    }

    .list-empty {
      margin: auto;
      padding: calc(var(--u) * 2);
      text-align: center;
      font-size: calc(var(--u) * 1.3);
      line-height: 1.6;
      color: #f4ead0;
    }

    /* Red dot on the SHOP button's top-left corner: a slot restocked while the shop was closed.
       Pops in with an overshoot, then keeps pulsing until the shop is opened. */
    .notif-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      box-sizing: border-box;
      background: #ff3b30;
      border: 2px solid #ffffff;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
      z-index: 6;
    }

    #shop-dot {
      right: 86px; /* dot centered on the LEFT edge: button 10px margin + 84px wide, minus half the dot */
      bottom: 32px; /* vertically centered on the button's top edge (10px margin + 32px tall) */
    }

    /* Same idea, one button up (BOXES sits above SHOP - see #boxes-btn). */
    #boxes-dot {
      right: 86px;
      bottom: 80px; /* boxes-btn's own top edge: 48px margin + 32px tall */
    }

    #game-container.boxes-open #shop-dot,
    #game-container.shop-open #boxes-dot {
      display: none;
    }

    /* Same dot on the top-right corner of the PROJECTILES button (inside #side-buttons, whose box is the button). */
    #projectiles-dot {
      right: -8px;
      top: -8px;
    }

    /* The same dot on the top-right corner of the SKINS button (the second button: 32px tall buttons, 8px gap -> it starts 40px down). */
    #skins-dot {
      right: -8px;
      top: 32px;
    }

    /* Same dot on the top-right corner of the OPTIONS button (the third: 80px down, 2 x (32 + 8)) - a reminder to sign in,
       not a "something new" notice: it stays on for as long as the player is signed out, see saves.js accountSectionHtml
       and collection.js's updateOptionsDot (2026-09-23). */
    #options-dot {
      right: -8px;
      top: 72px;
    }

    /* Same dot on the top-left corner of the BUFFS button (button: 10px from the right edge, 96px wide, 72px from the
       top - it swapped places with LEADERBOARD, this dot has to follow it there). */
    #buffs-dot {
      right: 98px; /* 10 + 96 - half the dot */
      top: 64px; /* 72 - half the dot */
    }

    #game-container.shop-open #buffs-dot,
    #game-container.boxes-open #buffs-dot {
      display: none;
    }

    /* On a card in the PROJECTILES / BUFFS lists: centred on the card's top-left corner. */
    .pick-new {
      left: -8px;
      top: -8px;
    }

    /* On the SIGN IN button itself (saves.js accountSectionHtml, 2026-09-23 - moved here from the account card's
       own corner): centred on the BUTTON's top-right corner. Sits inside .pick-action, which is already the
       positioning parent for a card's action button (see .pick-regen hanging under EQUIP) and hugs the button
       tightly when signed out, so this lines up on the button itself rather than the wider card. */
    .signin-dot {
      right: -8px;
      top: -8px;
    }

    .notif-dot.show {
      opacity: 1;
      animation: dot-pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) forwards, dot-pulse 1.3s ease-in-out 0.45s infinite;
    }

    #game-container.shop-open #shop-dot {
      display: none;
    }

    @keyframes dot-pop {
      0% { transform: scale(0); }
      60% { transform: scale(1.7); }
      100% { transform: scale(1); }
    }

    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.75); }
      50% { transform: scale(1.18); box-shadow: 0 0 0 6px rgba(255, 59, 48, 0); }
    }

    /* Coin counter: sits right above the BOXES button (which sits above SHOP/BACK, see #boxes-btn); over the
       corkboard (BOXES open) it moves to the top centre (see below). */
    #coin-counter {
      position: absolute;
      right: 10px;
      bottom: 86px; /* 10px margin + 32px SHOP button + 6px gap + 32px BOXES button + 6px gap */
      width: 84px;
      height: 22px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 9px;
      pointer-events: auto; /* same: tapping the coin counter must not start a throw */
      z-index: 4;
    }

    /* Over the corkboard (BOXES open - the only tab with that board any more, since the SHOP tab became a plain
       list, 2026-09-27) the counter moves to the top centre, in the middle of the board's top frame. */
    #game-container.boxes-open #coin-counter {
      right: auto;
      bottom: auto;
      left: 50%;
      top: calc(var(--u) * 2.8 - 11px); /* the frame band is ~5.6u tall: the 22px counter sits in its middle */
      transform: translateX(-50%);
    }

    /* LOADING SCREEN: covers the black gap before anything else is on screen (the game's own scripts, then Phaser's asset preload -
       character art, sounds, economy.json). Visible from the very first paint of the page - no script, font or image has to
       finish first - because it needs nothing but this CSS. The percentage is filled in once Phaser's real loader starts
       reporting progress (main.js); until then it just reads 0%, which is honest (nothing measurable has happened yet).
       Faded out by main.js the moment the game is actually ready (create()'s window.snowyBallsReady). Sits right under the
       cleansing screen (z-index 100) so the two never fight for which is on top - if cleansing also needs to show, it simply
       covers this one; both are solid black, so there is no seam either way. */
    #loading-screen {
      position: absolute;
      inset: 0;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: "Press Start 2P", monospace;
      font-size: 12px; /* the same size as #message's "TAP to AIM" - the loading text is styled to match it */
      line-height: 1.8;
      text-align: center;
    }

    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* THE GRAND CLEANSING: shown once, on the first load after the grand reset (see Economy SAVE_EPOCH) - a completely black screen with
       white text, held for a moment, then faded out into the game. Never shown again. */
    #cleansing {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(var(--u) * 4);
      box-sizing: border-box;
      background: #000;
      color: #fff;
      font-family: "Press Start 2P", monospace;
      font-size: calc(var(--u) * 2.2);
      line-height: 1.7;
      text-align: center;
      opacity: 1;
    }

    #cleansing.show { display: flex; }

    #cleansing span {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #cleansing.text-in span { opacity: 1; }

    #cleansing.fade {
      opacity: 0;
      transition: opacity 2.4s ease;
      pointer-events: none;
    }

    /* ---- OPTIONS list: the VOLUME section: a slider (0-100%, the master volume) and its value ---- */
    .vol-row {
      flex: none;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 1.4);
    }

    /* The name over the Weather slider (the first slider, the master volume, has none: the section's title is its name). */
    .vol-name {
      flex: none;
      color: #ffffff;
      font-size: calc(var(--u) * 1.2);
    }

    .vol-value {
      flex: none;
      width: calc(var(--u) * 5.2);
      text-align: right;
      color: #ffffff;
      font-size: calc(var(--u) * 1.2);
    }

    .vol-slider {
      --p: 50%; /* how far it is filled (set by the script) */
      flex: 1;
      min-width: 0;
      height: calc(var(--u) * 2.6);
      margin: 0;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      touch-action: none; /* dragging the handle must not scroll the list */
      cursor: pointer;
    }

    .vol-slider::-webkit-slider-runnable-track {
      height: calc(var(--u) * 1.2);
      background: linear-gradient(to right, #8b5a2b var(--p), #dcc9a0 var(--p));
      border: 2px solid #4a2f14;
      border-radius: 3px;
    }

    .vol-slider::-moz-range-track {
      height: calc(var(--u) * 1.2);
      background: linear-gradient(to right, #8b5a2b var(--p), #dcc9a0 var(--p));
      border: 2px solid #4a2f14;
      border-radius: 3px;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: calc(var(--u) * 2);
      height: calc(var(--u) * 2.6);
      margin-top: calc(var(--u) * -0.9 - 2px);
      background: #f4ead0;
      border: 2px solid #4a2f14;
      border-radius: 3px;
    }

    .vol-slider::-moz-range-thumb {
      box-sizing: border-box;
      width: calc(var(--u) * 2);
      height: calc(var(--u) * 2.6);
      background: #f4ead0;
      border: 2px solid #4a2f14;
      border-radius: 3px;
    }

    /* ---- OPTIONS list: the SAVES section ---- */
    /* A section of the OPTIONS list (SAVES now): a rectangle of its own with its heading inside. */
    .opt-section {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1.1);
      padding: calc(var(--u) * 1.2);
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid #4a2f14;
      border-radius: 4px;
    }

    .opt-head {
      flex: none;
      color: #ffffff;
      font-size: calc(var(--u) * 1.4);
    }

    /* ---- OPTIONS list: ACCOUNT (sign in with Google, src/cloud.js) and LEADERBOARD (everyone's current coins) ---- */
    .account-row {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--u) * 1.2);
      color: #ffffff;
      font-size: calc(var(--u) * 1.2);
    }

    .account-error {
      flex: none;
      color: #ff8a80;
      font-size: calc(var(--u) * 1.05);
    }

    .save-icon-btn {
      flex: none;
      box-sizing: border-box;
      padding: calc(var(--u) * 0.9) calc(var(--u) * 1.2);
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: calc(var(--u) * 1.1);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .save-icon-btn:active { background: #74491f; }

    /* CHANGE NAME + CHANGE DESCRIPTION side by side instead of stacked, splitting the row evenly. */
    .account-btn-row { flex: none; display: flex; gap: calc(var(--u) * 1); }
    .account-btn-row .save-icon-btn { flex: 1; min-width: 0; }

    /* A leaderboard card: place | name ... coins. Ranks 2-3 get the same epic tint the buff cards use, rank 1 the same
       travelling rainbow + pulsing shine a legendary buff card gets (.rarity-wave / .buff-card-shine, shared keyframes) -
       a look fixed BY RANK, not by anything about the player, so no rarity/amount corner (they have none). Everyone past
       3rd gets the plain card look every other list already uses. */
    .board-card {
      flex: none;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 1.2);
      padding: calc(var(--u) * 1.2) calc(var(--u) * 1.4);
      background: #f4ead0;
      border: 2px solid #7a5230;
      border-radius: 3px;
      color: #3b2412;
      font-size: calc(var(--u) * 1.4);
      cursor: pointer; /* holding it down inspects the player - see saves.js wireLeaderboardHold */
      -webkit-tap-highlight-color: transparent;
    }

    /* Every card with a cream/light background that can carry a rarity - the leaderboard/account card (rank 1 only),
       and (2026-09-23: "all legendary item cards, no matter if its a skin, projectile, buff... apply in the shop
       too") every .pick-row (PROJECTILES, BUFFS, a SKINS menu, the shop's own inspect popup - see Rarity.cardClass,
       collection.js) and .shop-card (the shop's 6 slots, shop.js) - gets the exact same rainbow once its rarity is
       the legendary one. One rule, one look, everywhere a rarity shows up. */
    .board-card.legendary,
    .account-card.legendary,
    .pick-row.legendary,
    .shop-card.legendary,
    .box-btn.legendary {
      background-image: linear-gradient(90deg, rgba(255, 77, 77, 0.32), rgba(255, 168, 77, 0.32), rgba(255, 240, 77, 0.32), rgba(91, 255, 110, 0.32),
        rgba(77, 210, 255, 0.32), rgba(106, 107, 255, 0.32), rgba(193, 77, 255, 0.32), rgba(255, 77, 77, 0.32));
      background-size: 200% 100%;
      /* ammo-shine, not buff-card-shine: that one also pulses `filter: brightness()`, which repaints every descendant
         (including the card's own picture) each frame - on a pixelated image that reads as a visible "wobble".
         ammo-shine (already used by #ammo-box/#leaderboard-btn with no such complaint) only pulses box-shadow. */
      animation: rarity-wave 2.4s linear infinite, ammo-shine 1.7s ease-in-out infinite;
    }

    /* Overrides the shine above for .shop-card specifically: unlike the other three, a shop card already has its
       own static pin-shadow (.shop-card's box-shadow: 2px 3px 0 ...) for the "pinned to corkboard" look - ammo-shine
       animates box-shadow too, and an element can only ever run ONE box-shadow animation, so it would silently
       replace that pin-shadow with just the glow for as long as the card stays legendary. This keyframe carries the
       pin-shadow as a second, unanimated layer alongside the same pulsing glow instead. */
    .shop-card.legendary {
      animation: rarity-wave 2.4s linear infinite, shop-card-shine 1.7s ease-in-out infinite;
    }

    @keyframes shop-card-shine {
      0%, 100% { box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.35), 0 0 1px rgba(255, 255, 255, 0.15); }
      50% { box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.35), 0 0 8px rgba(255, 255, 255, 0.85); }
    }

    .board-place {
      flex: none;
      width: calc(var(--u) * 2.6);
      text-align: center;
      color: #8a6a44;
    }

    .board-sep {
      flex: none;
      color: #c9b48a;
    }

    .board-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      /* Explicit headroom: "normal" left too little room above the cap-height in this pixel font, so .board-you's
         text-shadow (it reaches 1px above the glyphs themselves) got clipped by this element's own overflow:hidden -
         the "YOU" was visibly cut off at the top. Harmless for a plain name (still one line, still ellipsizes). */
      line-height: 1.5;
    }

    /* The signed-in player's own row (saves.js leaderboardCardHtml): a distinct colour + outline (the same outline
       treatment as .board-hint below) so it reads as a SYSTEM LABEL, not a name - a player could otherwise set their
       own account name to literally "YOU" (CHANGE NAME has no such restriction) and be indistinguishable from it. */
    .board-you {
      color: #ffffff;
      letter-spacing: 0.05em;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000;
    }

    .board-coins {
      flex: none;
      display: flex;
      align-items: baseline;
      gap: calc(var(--u) * 0.6);
      /* Explicit, not inherited: inside a .board-card this used to just inherit that card's own 1.4u font-size, but
         inside #board-inspect-card (inspecting a leaderboard entry's account card) nothing in the ancestor chain sets
         a font-size at all, so it fell back to the unscaled browser default - reading way too big next to everything
         else on the card, which is all sized in --u. Same 1.4u either way now. */
      font-size: calc(var(--u) * 1.4);
    }

    .board-coins .coin {
      display: inline-block;
      width: calc(var(--u) * 1.1);
      height: calc(var(--u) * 1.1);
      background: #f1c40f;
      border: 2px solid #b8860b;
      border-radius: 50%;
      box-sizing: border-box;
    }

    .board-empty {
      flex: none;
      color: #e6cfa3;
      font-size: calc(var(--u) * 1.1);
    }

    /* Fixed under the whole LEADERBOARD tab (index.html #list-hint, toggled by collection.js's open() - moved out
       of the scrollable cards, 2026-09-27, the owner's ask: "under the whole leaderboard tab", not scrolled away
       with them). Same look as the in-game "TAP to AIM" prompt (#message): white with a thin black outline, so
       it reads as an active instruction, not a muted hint like .board-empty above. Empty (no padding needed) for
       every other list kind. */
    .board-hint {
      flex: none;
      color: #ffffff;
      font-size: calc(var(--u) * 1.1);
      text-align: center;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000;
    }

    #list-hint:not(:empty) {
      padding: calc(var(--u) * 1) 0;
    }

    /* The leaderboard's inspect popup (saves.js: clicking a card) - lives over the LIST panel (list-open), not
       the shop (the shop tab no longer has an inspect popup of its own since it became a plain list, 2026-09-27). */
    #board-inspect {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 8; /* above the list panel (4) and its backdrop */
    }

    #game-container.list-open #board-inspect.show {
      opacity: 1;
      pointer-events: auto;
    }

    #board-inspect-card {
      width: 60%;
      font-family: "Press Start 2P", monospace;
      color: #3b2412;
    }

    /* A fixed height (as tall as a full 60-character bio ever needs, wrapped) - a safety net alongside the length cap and
       the word-break above, not the thing doing the capping: the card clips rather than grows if it's ever exceeded. */
    #board-inspect-card .pick-row {
      box-sizing: border-box;
      height: calc(var(--u) * 14);
      min-height: 0;
      overflow: hidden;
    }

    #board-inspect, .board-card { -webkit-touch-callout: none; }

    /* ---- popups (right now: only Cloud's "this account already has a save" sign-in confirm) ---- */
    #modal-layer {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.62);
      font-family: "Press Start 2P", monospace;
    }

    .modal-panel {
      width: calc(var(--u) * 58);
      max-width: 92%;
      box-sizing: border-box;
      padding: calc(var(--u) * 2);
      background: #f4ead0;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
      color: #3b2412;
    }

    .modal-title { font-size: calc(var(--u) * 1.8); margin-bottom: calc(var(--u) * 1.2); }
    .modal-text { font-size: calc(var(--u) * 1.1); line-height: 1.7; color: #6b4a2a; margin-bottom: calc(var(--u) * 1.2); }

    /* The account description/name edit boxes (saves.js showEditDescription / showEditName) - the only text inputs left
       once SAVES (named slots, import codes) was removed. */
    .modal-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: calc(var(--u) * 1);
      background: #fff8e6;
      border: 2px solid #7a5230;
      border-radius: 3px;
      color: #3b2412;
      font: calc(var(--u) * 1.4) "Press Start 2P", monospace;
    }

    .modal-status { min-height: calc(var(--u) * 2.6); margin-top: calc(var(--u) * 0.8); font-size: calc(var(--u) * 1); line-height: 1.6; color: #8a6a44; }
    .modal-status.bad { color: #a3261c; } /* CHANGE NAME's two failure cases - empty, or not enough coins */

    .modal-buttons { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1); justify-content: flex-end; margin-top: calc(var(--u) * 1.4); }

    .modal-btn {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--u) * 0.6);
      padding: calc(var(--u) * 1) calc(var(--u) * 1.6);
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: calc(var(--u) * 1.2);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-btn:active { background: #74491f; }
    .modal-btn.danger { background: #a3352b; }
    /* CANCEL / CLOSE / BACK: a proper button in the popup's own colours (tan with dark text), less loud than the main action but clearly pressable. */
    .modal-btn.ghost { background: #dcc9a0; border-color: #7a5230; color: #3b2412; }
    .modal-btn.ghost:active { background: #cbb789; }

    /* CHANGE NAME's price button (showEditName) - the button's OWN label is the price, so it needs the same little gold
       coin circle the leaderboard/board-coins uses, not just a number. */
    .modal-btn .coin {
      display: inline-block;
      width: calc(var(--u) * 1.1);
      height: calc(var(--u) * 1.1);
      background: #f1c40f;
      border: 2px solid #b8860b;
      border-radius: 50%;
      box-sizing: border-box;
    }

    #coin-counter .coin {
      flex: none;
      width: 9px;
      height: 9px;
      background: #f1c40f;
      border: 2px solid #b8860b;
      border-radius: 50%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="loading-screen"><span id="loading-text">Loading - 0%</span></div>
    <div id="cleansing"><span>The grand cleansing has struck.</span></div>
    <div id="message"></div>
    <!-- The corkboard/3x2 grid look used to be the SHOP tab's own; it's the BOXES feature's now (2026-09-27). -->
    <img id="boxes-board" src="assets/ui/shop_board.png" alt="" />
    <div id="boxes-items"></div>
    <div id="boxes-hint">HOLD to INSPECT</div>
    <div id="boxes-inspect"><div id="boxes-inspect-grid"></div><div id="boxes-inspect-caption">TAP to INSPECT</div></div>
    <div id="boxes-inspect-item"><div id="boxes-inspect-item-card"></div></div>
    <div id="board-inspect"><div id="board-inspect-card"></div></div>
    <div id="shop-backdrop"></div>
    <div id="shop-panel">
      <div id="shop-header"><span id="shop-title">SHOP</span><span id="shop-timer"></span></div>
      <div id="shop-scroll"></div>
    </div>
    <div id="shop-cats">
      <button id="shop-cat-projectile" class="shop-cat-btn active" type="button" data-cat="projectile">PROJECTILES</button>
      <button id="shop-cat-buff" class="shop-cat-btn" type="button" data-cat="buff">BUFFS</button>
    </div>
    <div id="list-backdrop"></div>
    <div id="list-panel">
      <div id="list-title"></div>
      <button id="list-back" type="button">BACK</button>
      <div id="version-tag"></div>
      <div id="list-scroll"></div>
      <div id="list-hint" class="board-hint"></div>
    </div>
    <div id="buff-hud"></div>
    <div id="aim-label"></div>
    <button id="buffs-btn" class="side-btn" type="button">BUFFS</button>
    <span id="buffs-dot" class="notif-dot"></span>
    <div id="ammo-box" class="hud-stat"><img id="ammo-icon" alt="" draggable="false" /><span id="ammo-text">x0</span></div>
    <button id="leaderboard-btn" class="side-btn" type="button">LEADERBOARD</button>
    <div id="side-buttons">
      <button id="projectiles-btn" class="side-btn" type="button">PROJECTILES</button>
      <span id="projectiles-dot" class="notif-dot"></span>
      <button id="skins-btn" class="side-btn" type="button">SKINS</button>
      <span id="skins-dot" class="notif-dot"></span>
      <button id="options-btn" class="side-btn" type="button">OPTIONS</button>
      <span id="options-dot" class="notif-dot"></span>
    </div>
    <div id="coin-counter"><i class="coin"></i><span id="coin-count">0</span></div>
    <button id="boxes-btn" type="button">BOXES</button>
    <span id="boxes-dot" class="notif-dot"></span>
    <button id="shop-btn" type="button">SHOP</button>
    <span id="shop-dot" class="notif-dot"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- The leaderboard's backend (src/cloud.js). Loaded from Google's own CDN, same as the Google Fonts stylesheet above.
       If this can't load (offline, blocked, or FIREBASE_CONFIG is still a placeholder - see cloud.js) the game is unaffected:
       every Cloud.* call is a guarded no-op until both the scripts and the config are really there. -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="src/version.js?v=300"></script>
  <script src="src/economy.js?v=46"></script>
  <script>
    // The grand cleansing screen: only if this load threw an existing save away (see Economy). Covers the game in black right away,
    // shows the sentence, and once the game is up (and the sentence has been read) fades out into it.
    (function () {
      if (typeof Economy === "undefined" || !Economy.wasCleansed()) return;
      const el = document.getElementById("cleansing");
      el.classList.add("show");
      // taps must not reach the game underneath while it is up
      ["touchstart", "touchend", "mousedown", "mouseup", "pointerdown", "pointerup", "click"].forEach((ev) => el.addEventListener(ev, (e) => e.stopPropagation()));
      const start = performance.now();
      let tapped = false; // a tap on the screen ends the wait (once the sentence has had a moment to be read)
      el.addEventListener("click", () => {
        if (performance.now() - start > 1200) tapped = true;
      });
      const fontsReady = document.fonts && document.fonts.load ? document.fonts.load('16px "Press Start 2P"') : Promise.resolve();
      Promise.race([fontsReady, new Promise((r) => setTimeout(r, 1500))]).then(() => el.classList.add("text-in"));
      const timer = setInterval(() => {
        const held = performance.now() - start;
        if ((window.snowyBallsReady && (held > 3200 || tapped)) || held > 14000) {
          clearInterval(timer);
          el.classList.add("fade");
          setTimeout(() => el.remove(), 2600);
        }
      }, 100);
    })();
  </script>
  <script src="src/cloud.js?v=26"></script>
  <script src="src/rarity.js?v=3"></script>
  <script src="src/buffs.js?v=33"></script>
  <script src="src/shop.js?v=39"></script>
  <script src="src/boxes.js?v=4"></script>
  <script src="src/volume.js?v=2"></script>
  <script src="src/saves.js?v=25"></script>
  <script src="src/collection.js?v=81"></script>
  <script src="src/main.js?v=190"></script>
  <script>
    // Phaser also listens on window for touches/clicks that start OUTSIDE the canvas, so taps on
    // the shop, the SHOP/BACK button and the mute button used to be fed to the game as throws.
    // Worse: when the shop re-rendered a card mid-touch, its touchend never reached window, Phaser
    // thought the finger was still down, and every later tap was ignored ("tap to aim" did nothing).
    // These elements are pure HTML UI, so keep their touches away from Phaser entirely.
    ["boxes-board", "boxes-items", "boxes-hint", "boxes-inspect", "boxes-inspect-item", "boxes-btn", "shop-panel", "shop-cats", "shop-backdrop", "shop-btn", "buffs-btn", "buff-hud", "ammo-box", "leaderboard-btn", "board-inspect", "coin-counter", "side-buttons", "list-panel", "list-backdrop"].forEach((id) => {
      const el = document.getElementById(id);
      ["touchstart", "touchend", "touchcancel", "mousedown", "mouseup"].forEach((type) => {
        el.addEventListener(type, (e) => e.stopPropagation());
      });
    });

    Collection.init();
    Cloud.init();

    // Live coin counter (above the SHOP/BACK button, visible in the game and in the shop).
    // From a million up the number is shortened so it always fits the box: 1M 2M ... 999M, then 1B 2B ... (rounded down).
    function formatCoins(n) {
      if (n >= 1e9) return Math.floor(n / 1e9) + "B";
      if (n >= 1e6) return Math.floor(n / 1e6) + "M";
      return String(n);
    }

    Economy.onCoinsChange((coins) => {
      document.getElementById("coin-count").textContent = formatCoins(coins);
    });

    // SHOP <-> BACK: same button, label swaps. Click sound goes through Phaser so the master
    // volume (the slider in OPTIONS) applies to it too.
    document.getElementById("shop-btn").addEventListener("click", () => {
      playUiClick();
      const container = document.getElementById("game-container");
      const open = container.classList.toggle("shop-open");
      document.getElementById("shop-btn").textContent = open ? "BACK" : "SHOP";
      if (open) {
        Collection.close();
        const game = window.snowyBallsGame;
        const scene = game && game.scene.getScene("main");
        if (scene && scene.onShopOpened) scene.onShopOpened(); // drop an aim in progress
      }
      if (open && typeof Shop !== "undefined") Shop.onOpen();
    });

    // BOXES <-> BACK: same idea as SHOP/BACK just above, its own class/button/module.
    document.getElementById("boxes-btn").addEventListener("click", () => {
      playUiClick();
      const container = document.getElementById("game-container");
      const open = container.classList.toggle("boxes-open");
      document.getElementById("boxes-btn").textContent = open ? "BACK" : "BOXES";
      if (open) {
        Collection.close();
        const game = window.snowyBallsGame;
        const scene = game && game.scene.getScene("main");
        if (scene && scene.onShopOpened) scene.onShopOpened(); // drop an aim in progress - same reasoning as the shop
      }
      if (open && typeof Boxes !== "undefined") Boxes.onOpen();
    });
  </script>
</body>
</html>
