<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SNOWY BALLS</title>
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SNOWY BALLS" />
  <link rel="manifest" href="manifest.json" />
  <!-- TODO: real icons from the assets/ui texture pass - see docs/NOTES.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Press Start 2P", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fills the page - as wide as the viewport allows, capped so it never taller than the
       viewport either (min() of both), aspect ratio always preserved. */
    #game-container {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      width: min(100vw, calc(100dvh * 16 / 9)); /* dvh: mobile browser bars don't push it off-screen */
      aspect-ratio: 16 / 9;
      overflow: hidden; /* nothing (buttons included) can poke outside the display */
      touch-action: manipulation;
    }

    #game-container canvas {
      image-rendering: pixelated;
      display: block;
    }

    /* All in-game text lives here now instead of as blurry upscaled Phaser canvas text - a
       real web font at native resolution reads far more crisply than pixel-doubled bitmap text
       does at this canvas's small internal resolution. Centered back over the game screen
       (its original spot as a Phaser Text object) rather than living below the canvas. */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      white-space: pre-line;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.85);
      pointer-events: none; /* sits on top of the canvas - taps must still reach the game below */
      z-index: 2;
    }

    /* Mute toggle, top-right of the game. Plain <img>-as-button since it's just an icon, no
       label needed. */
    #volume-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 5; /* above the shop board (3) so mute stays usable in the shop */
      will-change: transform; /* stable own layer - stops the icon shifting a pixel when the shop layer appears */
      transform: translateZ(0);
      -webkit-tap-highlight-color: transparent;
    }

    #volume-btn img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
      filter: none;
      opacity: 1;
      transition: filter 0.15s ease, opacity 0.15s ease;
    }

    #volume-btn.muted img {
      filter: grayscale(100%);
      opacity: 0.45;
    }

    /* Shop screen: shop_board.png stretched over the whole game display (canvas + message),
       faded in/out. Sits under the volume button (z 5) and the SHOP/BACK button (z 4). */
    #shop-board {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      will-change: opacity; /* own layer from the start, so the fade doesn't create one mid-click */
      z-index: 3;
    }

    #game-container.shop-open #shop-board {
      opacity: 1;
      pointer-events: auto; /* swallows taps so they can't reach the game underneath */
    }

    /* One button, label swaps SHOP <-> BACK, so position and size are identical by construction. */
    #shop-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 84px;
      height: 32px;
      padding: 0;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      cursor: pointer;
      z-index: 4;
      -webkit-tap-highlight-color: transparent;
    }

    #shop-btn:active {
      background: #74491f;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="message"></div>
    <img id="shop-board" src="assets/ui/shop_board.png" alt="" />
    <button id="shop-btn" type="button">SHOP</button>
    <button id="volume-btn" type="button" aria-label="Mute">
      <img src="assets/ui/volume_icon.png" alt="" />
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/economy.js?v=1"></script>
  <script src="src/main.js?v=35"></script>
  <script>
    // Toggles Phaser's global sound mute - waits for the game to exist since this can fire
    // before Phaser finishes booting on a slow load.
    document.getElementById("volume-btn").addEventListener("click", () => {
      const game = window.snowyBallsGame;
      if (!game) return;
      const nowMuted = !game.sound.mute;
      game.sound.mute = nowMuted;
      document.getElementById("volume-btn").classList.toggle("muted", nowMuted);
    });

    // SHOP <-> BACK: same button, label swaps. Click sound goes through Phaser so the mute
    // button and master volume apply to it too.
    document.getElementById("shop-btn").addEventListener("click", () => {
      const game = window.snowyBallsGame;
      if (game) game.sound.play("click", { volume: 0.8 });
      const container = document.getElementById("game-container");
      const open = container.classList.toggle("shop-open");
      document.getElementById("shop-btn").textContent = open ? "BACK" : "SHOP";
    });
  </script>
</body>
</html>
