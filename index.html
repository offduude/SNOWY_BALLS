<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SNOWY BALLS</title>
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SNOWY BALLS" />
  <link rel="manifest" href="manifest.json" />
  <!-- TODO: real icons from the assets/ui texture pass - see docs/NOTES.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Press Start 2P", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fills the page - as wide as the viewport allows, capped so it never taller than the
       viewport either (min() of both), aspect ratio always preserved. */
    #game-container {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      width: min(100vw, calc(100dvh * 16 / 9)); /* dvh: mobile browser bars don't push it off-screen */
      aspect-ratio: 16 / 9;
      overflow: hidden; /* nothing (buttons included) can poke outside the display */
      touch-action: manipulation;
    }

    #game-container canvas {
      image-rendering: pixelated;
      display: block;
      width: 100% !important; /* the container defines the 16:9 box; overrides any inline size */
      height: 100% !important;
    }

    /* All in-game text lives here now instead of as blurry upscaled Phaser canvas text - a
       real web font at native resolution reads far more crisply than pixel-doubled bitmap text
       does at this canvas's small internal resolution. Centered back over the game screen
       (its original spot as a Phaser Text object) rather than living below the canvas. */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      /* The FIRST line (HIT / MISS / TAP to AIM ...) is centred on the middle of the screen (half a line up = 0.9em);
         whatever else the message says (+N coins, Saved Projectile, the countdown) hangs below it. */
      transform: translate(-50%, -0.9em);
      width: 90%;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      white-space: pre-line;
      /* thin black outline (8 hard 1px shadows) so it reads on any background - all middle text has it */
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
        0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000;
      pointer-events: none; /* sits on top of the canvas - taps must still reach the game below */
      z-index: 2;
    }

    /* Mute toggle, top-right of the game. Plain <img>-as-button since it's just an icon, no
       label needed. */
    #volume-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 5; /* above the shop board (3) so mute stays usable in the shop */
      will-change: transform; /* stable own layer - stops the icon shifting a pixel when the shop layer appears */
      transform: translateZ(0);
      -webkit-tap-highlight-color: transparent;
    }

    #volume-btn img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
      filter: none;
      opacity: 1;
      transition: filter 0.15s ease, opacity 0.15s ease;
    }

    #volume-btn.muted img {
      filter: grayscale(100%);
      opacity: 0.45;
    }

    /* Shop screen: shop_board.png stretched over the whole game display (canvas + message),
       faded in/out. Sits under the volume button (z 5) and the SHOP/BACK button (z 4). */
    #shop-board {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      image-rendering: pixelated;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      will-change: opacity; /* own layer from the start, so the fade doesn't create one mid-click */
      z-index: 3;
    }

    #game-container.shop-open #shop-board {
      opacity: 1;
      pointer-events: auto; /* swallows taps so they can't reach the game underneath */
    }

    /* --u = 1% of the display width, so shop text scales with the game on any screen. */
    #game-container {
      --u: calc(min(100vw, 100vh * 16 / 9) / 100);
      --u: calc(min(100vw, 100dvh * 16 / 9) / 100);
    }

    /* Items pinned on the cork part of shop_board.png (cork is ~9%-91% across, ~9%-90% down). */
    #shop-items {
      position: absolute;
      left: 9%;
      top: 9%;
      width: 82%;
      height: 81%;
      box-sizing: border-box;
      padding: calc(var(--u) * 1.2);
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1.6);
      font-family: "Press Start 2P", monospace;
      color: #3b2412;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      will-change: opacity;
      z-index: 3;
    }

    #game-container.shop-open #shop-items {
      opacity: 1;
      pointer-events: auto;
    }

    .shop-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: calc(var(--u) * 2.4) calc(var(--u) * 2);
      min-height: 0;
    }

    .shop-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      min-width: 0;
      min-height: 0;
      padding: calc(var(--u) * 1.4) calc(var(--u) * 1.2) calc(var(--u) * 1);
      background: #f4ead0;
      border: 2px solid #7a5230;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.35);
      color: #3b2412;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, opacity 0.2s ease;
    }

    /* the pin */
    .shop-card::before {
      content: "";
      position: absolute;
      top: calc(var(--u) * -0.9);
      left: 50%;
      width: calc(var(--u) * 1.4);
      height: calc(var(--u) * 1.4);
      transform: translateX(-50%);
      background: #c0392b;
      border-radius: 50%;
      box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.4);
    }

    .shop-card:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
    .shop-card.empty { opacity: 0.55; cursor: default; justify-content: center; align-items: center; text-align: center; gap: calc(var(--u) * 1.2); }
    .shop-timer { font-size: calc(var(--u) * 1.8); }
    .shop-card.cant { opacity: 0.7; }
    .shop-card.cant .shop-price { color: #a3261c; }
    .shop-card.bought { opacity: 0; transform: scale(0.9); }
    .shop-card.shake { animation: shop-shake 0.3s linear; }

    @keyframes shop-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(calc(var(--u) * -0.6)); }
      75% { transform: translateX(calc(var(--u) * 0.6)); }
    }

    .shop-cat {
      font-size: calc(var(--u) * 0.95);
      color: #8a6a44;
      letter-spacing: 0.05em;
    }

    /* Top row of a shop card: PROJECTILE / BUFF at the left, the rarity at the right (same text style, its own colour). */
    .shop-top {
      align-self: stretch;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    /* Rarity labels are plain coloured text, no background; a thin dark outline keeps the light colours readable on the
       cream cards. */
    .shop-rarity,
    .pick-rarity {
      letter-spacing: 0.05em;
      text-shadow: 1px 0 #3b2412, -1px 0 #3b2412, 0 1px #3b2412, 0 -1px #3b2412;
    }

    .shop-rarity { font-size: calc(var(--u) * 0.95); }

    /* LEGENDARY: rainbow waves that keep travelling through the letters, plus a shine that pulses brighter and dimmer.
       (The text is a clipped gradient, so the outline and the glow are drop-shadow filters, not text-shadow.) */
    .rarity-rainbow {
      display: inline-block;
      text-shadow: none;
      background: linear-gradient(90deg, #ff4d4d, #ffa84d, #fff04d, #5bff6e, #4dd2ff, #6a6bff, #c14dff, #ff4d4d);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: rarity-wave 2.4s linear infinite, rarity-shine 1.7s ease-in-out infinite;
    }

    @keyframes rarity-wave {
      from { background-position: 0% 50%; }
      to { background-position: 200% 50%; }
    }

    @keyframes rarity-shine {
      0%, 100% {
        filter: drop-shadow(1px 0 0 #3b2412) drop-shadow(-1px 0 0 #3b2412) drop-shadow(0 1px 0 #3b2412) drop-shadow(0 -1px 0 #3b2412)
          drop-shadow(0 0 1px rgba(255, 255, 255, 0.15)) brightness(1);
      }
      50% {
        filter: drop-shadow(1px 0 0 #3b2412) drop-shadow(-1px 0 0 #3b2412) drop-shadow(0 1px 0 #3b2412) drop-shadow(0 -1px 0 #3b2412)
          drop-shadow(0 0 5px rgba(255, 255, 255, 0.95)) brightness(1.35);
      }
    }

    /* Space for the item's picture: takes whatever height is left between the category and the name. */
    .shop-pic {
      position: relative; /* the availability timer sits in its top-left corner */
      flex: 1;
      align-self: stretch;
      min-height: 0;
      /* The rectangle sits a little higher (0.15u under the category row instead of 0.5u; the 0.35u goes to the bottom, so it
         keeps its height) and the picture inside is a little smaller and lower (padding), clear of the availability timer. */
      margin: calc(var(--u) * 0.15) 0 calc(var(--u) * 0.85);
      padding: calc(var(--u) * 0.9) calc(var(--u) * 0.4) calc(var(--u) * 0.3);
      box-sizing: border-box;
      background: rgba(122, 82, 48, 0.1);
      border-radius: 2px;
    }

    /* How long until the item on sale is replaced (its slot rerolls): same look as the max time stat in the BUFFS tab. */
    .shop-avail {
      position: absolute;
      top: calc(var(--u) * 0.6);
      left: calc(var(--u) * 0.8);
      font-size: calc(var(--u) * 0.85);
      color: #8a6a44;
      white-space: nowrap;
      z-index: 1;
      pointer-events: none;
    }

    .shop-pic img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .shop-name {
      align-self: stretch;
      text-align: center;
      font-size: calc(var(--u) * 1.5);
      line-height: 1.35;
      overflow-wrap: anywhere;
      margin-bottom: calc(var(--u) * 0.6);
    }

    /* Bottom row of a shop card: the amount of a stack at the left, the price at the right. */
    .shop-bottom {
      align-self: stretch;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shop-amount {
      font-size: calc(var(--u) * 1.8);
      color: #8a6a44; /* the lighter brown used for amounts elsewhere */
    }

    .shop-price {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 0.7);
      font-size: calc(var(--u) * 1.8);
    }

    .shop-price .coin {
      display: inline-block;
      width: calc(var(--u) * 1.6);
      height: calc(var(--u) * 1.6);
      background: #f1c40f;
      border: 2px solid #b8860b;
      border-radius: 50%;
      box-sizing: border-box;
    }

    /* One button, label swaps SHOP <-> BACK, so position and size are identical by construction. */
    #shop-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 84px;
      height: 32px;
      padding: 0;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      cursor: pointer;
      z-index: 4;
      -webkit-tap-highlight-color: transparent;
    }

    #shop-btn:active,
    .side-btn:active {
      background: #74491f;
    }

    /* PROJECTILES / CHARACTERS buttons: middle of the left edge, same look as the SHOP button.
       Hidden (and untappable) while the shop is open. */
    #side-buttons {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5; /* above the list panel, so both stay usable when a list is open */
      transition: opacity 0.25s ease;
    }

    #game-container.shop-open #side-buttons {
      opacity: 0;
      pointer-events: none;
    }

    .side-btn {
      width: 108px;
      height: 32px;
      padding: 0;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .side-btn.active {
      background: #74491f;
    }

    /* The list: centered, same size for both lists, clear of the screen edges. */
    #list-backdrop,
    #list-panel {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #list-backdrop {
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 3;
    }

    #list-panel {
      left: 24%;
      top: 12%;
      width: 52%;
      height: 76%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
      font-family: "Press Start 2P", monospace;
      color: #3b2412;
      z-index: 4;
    }

    #game-container.list-open #list-backdrop,
    #game-container.list-open #list-panel {
      opacity: 1;
      pointer-events: auto;
    }

    #game-container.shop-open #list-backdrop,
    #game-container.shop-open #list-panel {
      opacity: 0;
      pointer-events: none;
    }

    #list-title {
      flex: none;
      /* the bottom is 8px shorter: #list-scroll starts with 8px of padding, room for the "new" dot that sticks out over the first card's corner */
      padding: calc(var(--u) * 1.2) calc(var(--u) * 1.6) max(0px, calc(var(--u) * 1.2 - 8px));
      color: #ffffff;
      font-size: calc(var(--u) * 1.5);
      text-align: center;
    }

    /* Scrolled with the finger - no scrollbar/slider. */
    #list-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1.2);
      padding: 8px calc(var(--u) * 1.2) calc(var(--u) * 1.2);
    }

    #list-scroll::-webkit-scrollbar {
      display: none;
    }

    /* A projectile card is a grid: the picture on the left spanning both rows (so it stays centered on the card),
       the name/description and the EQUIP button on the first row, and the weight / hit value stats in ONE row along the
       bottom, starting right after the picture and running under the text and the button. */
    .pick-row.has-stats {
      /* Every projectile card is at least as tall as one with a 3-line description (12.97 units measured, padding and
         border included), so the EQUIP button (centred in the first row) is at the same height on every card. */
      box-sizing: border-box;
      min-height: calc(var(--u) * 13.05);
      display: grid;
      grid-template-rows: 1fr auto;
      grid-template-columns: auto minmax(0, 1fr) auto;
      column-gap: calc(var(--u) * 1.4);
      row-gap: calc(var(--u) * 0.9);
      align-items: center;
    }

    /* A buff card is as tall as a projectile card, so the length of its description never changes its height (a
       description of up to 3 lines fits; the USE button / timer is centred, i.e. where EQUIP is on a projectile). */
    .pick-row.buff-row {
      box-sizing: border-box;
      min-height: calc(var(--u) * 13.05);
    }

    /* A buff's bottom line ("Coins bonus: 1.2x.") sits at the bottom of the card, under the text column (picture: 9u + gap). */
    .pick-row.buff-row .pick-stats {
      position: absolute;
      left: calc(var(--u) * 11.6 + 2px);
      bottom: calc(var(--u) * 1.2);
    }

    .pick-row.has-stats .pick-pic { grid-column: 1; grid-row: 1 / span 2; }
    .pick-row.has-stats .pick-text { grid-column: 2; grid-row: 1; align-self: start; }
    .pick-row.has-stats .pick-action { grid-column: 3; grid-row: 1; }
    .pick-row.has-stats .pick-stats { grid-column: 2 / 4; grid-row: 2; }

    /* Two fixed columns: the left one is as wide as the longest weight word ("weight: very heavy" = 18 characters, one
       em each in this font), so "hit value" always starts in the same place. */
    .pick-stats {
      display: grid;
      grid-template-columns: calc(var(--u) * 19.5) auto;
      font-size: calc(var(--u) * 1);
      color: #8a6a44; /* the same lighter brown as the amount (x12) */
      white-space: nowrap;
    }

    .pick-stat .coin {
      display: inline-block;
      width: calc(var(--u) * 1.1);
      height: calc(var(--u) * 1.1);
      margin: 0 calc(var(--u) * 0.3);
      background: #f1c40f;
      border: 2px solid #b8860b;
      border-radius: 50%;
      box-sizing: border-box;
      /* In Press Start 2P the digits' ink centre sits 0.565em above the baseline (measured), and this 1.1em coin has
         its centre 0.55em above the baseline when it stands on the baseline - so the number lines up with the coin. */
      vertical-align: baseline;
    }

    .pick-row {
      position: relative; /* the amount is placed in its top-right corner */
      flex: none;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 1.4);
      padding: calc(var(--u) * 1.2);
      background: #f4ead0;
      border: 2px solid #7a5230;
      border-radius: 3px;
    }

    .pick-pic {
      flex: none;
      width: calc(var(--u) * 9);
      height: calc(var(--u) * 9);
      object-fit: contain;
      image-rendering: pixelated;
      background: rgba(122, 82, 48, 0.12);
      border-radius: 2px;
    }

    /* Stretched to the card's height, so the name always starts at the top of the card (not centered when the
       description is short) - the picture and the button stay centered. */
    .pick-text {
      flex: 1;
      align-self: stretch;
      min-width: 0;
    }

    .pick-name {
      font-size: calc(var(--u) * 1.6);
      line-height: 1.3;
      margin-bottom: calc(var(--u) * 0.8);
    }

    /* Top-right corner of a card in the lists: the rarity label, then the amount (x22) to its right, on one row. */
    .pick-corner {
      position: absolute;
      top: calc(var(--u) * 0.9);
      right: calc(var(--u) * 1.2);
      display: flex;
      align-items: baseline;
      gap: calc(var(--u) * 0.9);
      font-size: calc(var(--u) * 1.3);
      line-height: 1;
    }

    .pick-count {
      color: #8a6a44;
    }

    .pick-desc {
      font-size: calc(var(--u) * 1.1);
      line-height: 1.6;
      color: #6b4a2a;
    }

    /* The EQUIP button in its own box, so a line of text can hang under it (the snowball's "+1 in 00:27") without
       moving the button - it stays at the same height on every card. */
    .pick-action {
      position: relative;
      flex: none;
    }

    .pick-regen {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: calc(var(--u) * 0.6);
      font-size: calc(var(--u) * 0.85);
      color: #8a6a44;
      white-space: nowrap;
    }

    /* "Doesn't stack." in the same row as a buff's detail line ("Save chance: 10%."), in the same style, at the right end of the row */
    .pick-row.buff-row .pick-nostack {
      position: absolute;
      right: calc(var(--u) * 1.2);
      bottom: calc(var(--u) * 1.2);
      font-size: calc(var(--u) * 1);
      color: #8a6a44;
      white-space: nowrap;
    }

    .pick-equip {
      flex: none;
      box-sizing: border-box;
      /* Always as wide as "EQUIPPED" (8 glyphs, 1em each in this font, plus padding and border), so
         switching between EQUIP and EQUIPPED never changes the row's layout. */
      width: calc(var(--u) * (1.2 * 8 + 2.4) + 4px);
      text-align: center;
      padding: calc(var(--u) * 1) 0;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: calc(var(--u) * 1.2);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .pick-equip:active { background: #74491f; }
    .pick-equip.on { background: #b9a88f; border-color: #8a7a62; color: #f4ead0; cursor: default; }

    /* Buff cards: top of the screen, right of the live display (its frame spans 4..133 of 432 canvas
       px across and 4..67 of 243 down - keep in step with createTargetCamera). Cards stack down until the
       column is as tall as the live display, then wrap into a new column. Taps pass through to the game. */
    #buff-hud {
      position: absolute;
      left: 31.7%;
      top: 1.65%;
      height: 25.9%;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: calc(var(--u) * 0.5);
      pointer-events: none;
      z-index: 2;
    }

    .buff-card {
      pointer-events: auto; /* tapping a card cancels the buff (the rest of the HUD lets taps through) */
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 0.7);
      height: calc(var(--u) * 4);
      box-sizing: border-box;
      padding: 0 calc(var(--u) * 0.9) 0 calc(var(--u) * 0.5);
      background: rgba(20, 14, 10, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: calc(var(--u) * 0.7);
      font-family: "Press Start 2P", monospace;
      color: #ffffff;
    }

    /* The card's background is tinted with its buff's rarity colour (set on the card as --tint by buffs.js) ... */
    .buff-card.tinted {
      background-image: linear-gradient(var(--tint), var(--tint));
    }

    /* ... and a LEGENDARY card gets the rainbow: waves travelling through the background, and a glow that pulses (the same
       waves and shine as the rarity text, see .rarity-rainbow). */
    .buff-card.rainbow {
      background-image: linear-gradient(90deg, rgba(255, 77, 77, 0.55), rgba(255, 168, 77, 0.55), rgba(255, 240, 77, 0.55), rgba(91, 255, 110, 0.55),
        rgba(77, 210, 255, 0.55), rgba(106, 107, 255, 0.55), rgba(193, 77, 255, 0.55), rgba(255, 77, 77, 0.55));
      background-size: 200% 100%;
      animation: rarity-wave 2.4s linear infinite, buff-card-shine 1.7s ease-in-out infinite;
    }

    @keyframes buff-card-shine {
      0%, 100% { box-shadow: 0 0 1px rgba(255, 255, 255, 0.15); filter: brightness(1); }
      50% { box-shadow: 0 0 calc(var(--u) * 1.1) rgba(255, 255, 255, 0.85); filter: brightness(1.3); }
    }

    .buff-card img,
    .buff-noimg {
      width: calc(var(--u) * 3);
      height: calc(var(--u) * 3);
      object-fit: contain;
      image-rendering: pixelated;
      flex: none;
    }

    .buff-timer {
      font-size: calc(var(--u) * 1.15);
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
    }

    /* BUFFS button: left of the mute button (top-right), same look as the other brown buttons. */
    #buffs-btn {
      position: absolute;
      top: 10px;
      right: 46px;
      width: 60px;
      height: 28px;
      z-index: 5;
      transition: opacity 0.25s ease;
    }

    /* "OFFSET" / "STRENGTH" above the left end of the aim bar (bar: 20px from the left of the 432px canvas, its
       top 223px down of 243). Text starts where the bar does; no background, only a thin dark outline. */
    #aim-label {
      position: absolute;
      left: 4.63%; /* 20 / 432 - the bar's left end */
      bottom: 11.93%; /* just above the bar and its marker: (243 - 223 + 9) / 243 */
      display: none;
      font-family: "Press Start 2P", monospace;
      font-size: calc(var(--u) * 1.5);
      line-height: 1;
      letter-spacing: 0.02em;
      text-shadow: 1px 0 #202020, -1px 0 #202020, 0 1px #202020, 0 -1px #202020, 1px 1px #202020, -1px -1px #202020,
        1px -1px #202020, -1px 1px #202020;
      pointer-events: none;
      z-index: 2;
    }

    #aim-label.show {
      display: block;
    }

    /* STREAK: always visible, right under the top-right buttons. Same width as the BUFFS + mute
       buttons together (mute 10..38px from the right edge, BUFFS 46..106px -> 96px), same brown as the coin
       counter. Under the shop board (z 3), so they disappear with the rest of the game view in the shop. */
    .hud-stat {
      position: absolute;
      right: 10px;
      width: 96px;
      height: 22px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      white-space: nowrap;
      pointer-events: auto; /* a tap on the counter does nothing - it must not start a throw (see the touch-blocking list below) */
      z-index: 2;
    }

    #streak-box { top: 44px; } /* 10px margin + 28px buttons + 6px gap */

    #game-container.shop-open #buffs-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* The running timer sits exactly where the USE / EQUIP button is (same width), so nothing shifts when a button
       turns into a timer. */
    .pick-timer {
      flex: none;
      box-sizing: border-box;
      width: calc(var(--u) * (1.2 * 8 + 2.4) + 4px);
      text-align: center;
      /* Exactly the height of the USE button (padding 1u + border 2px + a 1.2u line), so the max time under it ("03:00")
         is at the same place whether the buff is running or not. */
      padding: calc(var(--u) * 1) 0;
      border: 2px solid transparent;
      line-height: calc(var(--u) * 1.2);
      font-size: calc(var(--u) * 1.5);
      color: #3b2412;
    }

    .list-empty {
      margin: auto;
      padding: calc(var(--u) * 2);
      text-align: center;
      font-size: calc(var(--u) * 1.3);
      line-height: 1.6;
      color: #f4ead0;
    }

    /* Red dot on the SHOP button's top-left corner: a slot restocked while the shop was closed.
       Pops in with an overshoot, then keeps pulsing until the shop is opened. */
    .notif-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      box-sizing: border-box;
      background: #ff3b30;
      border: 2px solid #ffffff;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
      z-index: 6;
    }

    #shop-dot {
      right: 86px; /* dot centered on the LEFT edge: button 10px margin + 84px wide, minus half the dot */
      bottom: 32px; /* vertically centered on the button's top edge (10px margin + 32px tall) */
    }

    /* Same dot on the top-right corner of the PROJECTILES button (inside #side-buttons, whose box is the button). */
    #projectiles-dot {
      right: -8px;
      top: -8px;
    }

    /* Same dot on the top-left corner of the BUFFS button (button: 46px from the right edge, 60px wide, 10px from the top). */
    #buffs-dot {
      right: 98px; /* 46 + 60 - half the dot */
      top: 2px; /* 10 - half the dot */
    }

    #game-container.shop-open #buffs-dot {
      display: none;
    }

    /* On a card in the PROJECTILES / BUFFS lists: centred on the card's top-left corner. */
    .pick-new {
      left: -8px;
      top: -8px;
    }

    .notif-dot.show {
      opacity: 1;
      animation: dot-pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) forwards, dot-pulse 1.3s ease-in-out 0.45s infinite;
    }

    #game-container.shop-open #shop-dot {
      display: none;
    }

    @keyframes dot-pop {
      0% { transform: scale(0); }
      60% { transform: scale(1.7); }
      100% { transform: scale(1); }
    }

    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.75); }
      50% { transform: scale(1.18); box-shadow: 0 0 0 6px rgba(255, 59, 48, 0); }
    }

    /* Coin counter: sits right above the SHOP/BACK button; in the shop it moves to the top centre (see below). */
    #coin-counter {
      position: absolute;
      right: 10px;
      bottom: 48px; /* 10px margin + 32px button + 6px gap */
      width: 84px;
      height: 22px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 9px;
      pointer-events: auto; /* same: tapping the coin counter must not start a throw */
      z-index: 4;
    }

    /* In the shop the counter moves to the top centre of the screen, in the middle of the board's top frame. */
    #game-container.shop-open #coin-counter {
      right: auto;
      bottom: auto;
      left: 50%;
      top: calc(var(--u) * 2.8 - 11px); /* the frame band is ~5.6u tall: the 22px counter sits in its middle */
      transform: translateX(-50%);
    }

    /* THE GRAND CLEANSING: shown once, on the first load after the grand reset (see Economy SAVE_EPOCH) - a completely black screen with
       white text, held for a moment, then faded out into the game. Never shown again. */
    #cleansing {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(var(--u) * 4);
      box-sizing: border-box;
      background: #000;
      color: #fff;
      font-family: "Press Start 2P", monospace;
      font-size: calc(var(--u) * 2.2);
      line-height: 1.7;
      text-align: center;
      opacity: 1;
    }

    #cleansing.show { display: flex; }

    #cleansing span {
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #cleansing.text-in span { opacity: 1; }

    #cleansing.fade {
      opacity: 0;
      transition: opacity 2.4s ease;
      pointer-events: none;
    }

    /* ---- OPTIONS list: the SAVES section ---- */
    /* A section of the OPTIONS list (SAVES now): a rectangle of its own with its heading inside. */
    .opt-section {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1.1);
      padding: calc(var(--u) * 1.2);
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid #4a2f14;
      border-radius: 4px;
    }

    .opt-head {
      flex: none;
      color: #ffffff;
      font-size: calc(var(--u) * 1.4);
    }

    .save-row {
      flex: none;
      display: flex;
      gap: calc(var(--u) * 1);
      align-items: stretch;
    }

    /* A save slot: a card with a name and, under it, when it was last loaded. */
    .save-slot {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: calc(var(--u) * 0.9);
      min-height: calc(var(--u) * 8.4);
      padding: calc(var(--u) * 1.2) calc(var(--u) * 1.4);
      box-sizing: border-box;
      text-align: left;
      background: #f4ead0;
      border: 2px solid #7a5230;
      border-radius: 3px;
      color: #3b2412;
      font-family: "Press Start 2P", monospace;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .save-slot .save-name { font-size: calc(var(--u) * 1.6); line-height: 1.3; }
    .save-slot .save-date { font-size: calc(var(--u) * 1); color: #8a6a44; }
    .save-slot.active { border-color: #3b8a3b; box-shadow: inset 0 0 0 2px #3b8a3b; cursor: default; }

    .save-tag {
      position: absolute;
      top: calc(var(--u) * 0.9);
      right: calc(var(--u) * 1.2);
      font-size: calc(var(--u) * 1);
      color: #2f7a2f;
    }

    /* An empty slot: dimmed, dashed, just "+ CREATE". */
    .save-slot.empty {
      align-items: center;
      background: rgba(244, 234, 208, 0.18);
      border: 2px dashed #d9c9a3;
      color: #f4ead0;
      font-size: calc(var(--u) * 1.6);
    }

    /* The two small buttons to the right of a slot: download (export) and trash (delete), one above the other. */
    .save-btns {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 0.8);
      width: calc(var(--u) * 6);
    }

    .save-icon {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .save-icon:active { background: #74491f; }
    .save-icon svg { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); }

    /* ---- popups (export / import / create / delete / load) ---- */
    #modal-layer {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.62);
      font-family: "Press Start 2P", monospace;
    }

    .modal-panel {
      width: calc(var(--u) * 58);
      max-width: 92%;
      box-sizing: border-box;
      padding: calc(var(--u) * 2);
      background: #f4ead0;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
      color: #3b2412;
    }

    .modal-title { font-size: calc(var(--u) * 1.8); margin-bottom: calc(var(--u) * 1.2); }
    .modal-text { font-size: calc(var(--u) * 1.1); line-height: 1.7; color: #6b4a2a; margin-bottom: calc(var(--u) * 1.2); }

    .modal-code,
    .modal-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #fff8e6;
      border: 2px solid #7a5230;
      border-radius: 3px;
      color: #3b2412;
      resize: none;
    }

    .modal-code { height: calc(var(--u) * 13); padding: calc(var(--u) * 0.8); font: calc(var(--u) * 1) monospace; word-break: break-all; }
    .modal-input { padding: calc(var(--u) * 1); font: calc(var(--u) * 1.4) "Press Start 2P", monospace; }
    .modal-status { min-height: calc(var(--u) * 2.6); margin-top: calc(var(--u) * 0.8); font-size: calc(var(--u) * 1); line-height: 1.6; }
    .modal-status.ok { color: #2f7a2f; }
    .modal-status.bad { color: #a3352b; }
    .modal-buttons { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1); justify-content: flex-end; margin-top: calc(var(--u) * 1.4); }

    .modal-btn {
      padding: calc(var(--u) * 1) calc(var(--u) * 1.6);
      background: #8b5a2b;
      border: 2px solid #4a2f14;
      border-radius: 4px;
      color: #ffffff;
      font-family: inherit;
      font-size: calc(var(--u) * 1.2);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-btn:active { background: #74491f; }
    .modal-btn.danger { background: #a3352b; }
    /* CANCEL / CLOSE / BACK: a proper button in the popup's own colours (tan with dark text), less loud than the main action but clearly pressable. */
    .modal-btn.ghost { background: #dcc9a0; border-color: #7a5230; color: #3b2412; }
    .modal-btn.ghost:active { background: #cbb789; }
    .modal-btn.off { opacity: 0.4; cursor: default; }

    #coin-counter .coin {
      flex: none;
      width: 9px;
      height: 9px;
      background: #f1c40f;
      border: 2px solid #b8860b;
      border-radius: 50%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="cleansing"><span>The grand cleansing has struck.</span></div>
    <div id="message"></div>
    <img id="shop-board" src="assets/ui/shop_board.png" alt="" />
    <div id="shop-items"></div>
    <div id="list-backdrop"></div>
    <div id="list-panel">
      <div id="list-title"></div>
      <div id="list-scroll"></div>
    </div>
    <div id="buff-hud"></div>
    <div id="aim-label"></div>
    <button id="buffs-btn" class="side-btn" type="button">BUFFS</button>
    <span id="buffs-dot" class="notif-dot"></span>
    <div id="streak-box" class="hud-stat"><span id="streak-text">STREAK: 0</span></div>
    <div id="side-buttons">
      <button id="projectiles-btn" class="side-btn" type="button">PROJECTILES</button>
      <span id="projectiles-dot" class="notif-dot"></span>
      <button id="options-btn" class="side-btn" type="button">OPTIONS</button>
    </div>
    <div id="coin-counter"><i class="coin"></i><span id="coin-count">0</span></div>
    <button id="shop-btn" type="button">SHOP</button>
    <span id="shop-dot" class="notif-dot"></span>
    <button id="volume-btn" type="button" aria-label="Mute">
      <img src="assets/ui/volume_icon.png" alt="" />
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/economy.js?v=24"></script>
  <script>
    // The grand cleansing screen: only if this load threw an existing save away (see Economy). Covers the game in black right away,
    // shows the sentence, and once the game is up (and the sentence has been read) fades out into it.
    (function () {
      if (typeof Economy === "undefined" || !Economy.wasCleansed()) return;
      const el = document.getElementById("cleansing");
      el.classList.add("show");
      // taps must not reach the game underneath while it is up
      ["touchstart", "touchend", "mousedown", "mouseup", "pointerdown", "pointerup", "click"].forEach((ev) => el.addEventListener(ev, (e) => e.stopPropagation()));
      const start = performance.now();
      let tapped = false; // a tap on the screen ends the wait (once the sentence has had a moment to be read)
      el.addEventListener("click", () => {
        if (performance.now() - start > 1200) tapped = true;
      });
      const fontsReady = document.fonts && document.fonts.load ? document.fonts.load('16px "Press Start 2P"') : Promise.resolve();
      Promise.race([fontsReady, new Promise((r) => setTimeout(r, 1500))]).then(() => el.classList.add("text-in"));
      const timer = setInterval(() => {
        const held = performance.now() - start;
        if ((window.snowyBallsReady && (held > 3200 || tapped)) || held > 14000) {
          clearInterval(timer);
          el.classList.add("fade");
          setTimeout(() => el.remove(), 2600);
        }
      }, 100);
    })();
  </script>
  <script src="src/rarity.js?v=2"></script>
  <script src="src/buffs.js?v=15"></script>
  <script src="src/shop.js?v=23"></script>
  <script src="src/saves.js?v=5"></script>
  <script src="src/collection.js?v=45"></script>
  <script src="src/main.js?v=118"></script>
  <script>
    // Phaser also listens on window for touches/clicks that start OUTSIDE the canvas, so taps on
    // the shop, the SHOP/BACK button and the mute button used to be fed to the game as throws.
    // Worse: when the shop re-rendered a card mid-touch, its touchend never reached window, Phaser
    // thought the finger was still down, and every later tap was ignored ("tap to aim" did nothing).
    // These elements are pure HTML UI, so keep their touches away from Phaser entirely.
    ["shop-board", "shop-items", "shop-btn", "volume-btn", "buffs-btn", "buff-hud", "streak-box", "coin-counter", "side-buttons", "list-panel", "list-backdrop"].forEach((id) => {
      const el = document.getElementById(id);
      ["touchstart", "touchend", "touchcancel", "mousedown", "mouseup"].forEach((type) => {
        el.addEventListener(type, (e) => e.stopPropagation());
      });
    });

    Collection.init();

    // Live coin counter (above the SHOP/BACK button, visible in the game and in the shop).
    // From a million up the number is shortened so it always fits the box: 1M 2M ... 999M, then 1B 2B ... (rounded down).
    function formatCoins(n) {
      if (n >= 1e9) return Math.floor(n / 1e9) + "B";
      if (n >= 1e6) return Math.floor(n / 1e6) + "M";
      return String(n);
    }

    Economy.onCoinsChange((coins) => {
      document.getElementById("coin-count").textContent = formatCoins(coins);
    });

    // Toggles Phaser's global sound mute - waits for the game to exist since this can fire
    // before Phaser finishes booting on a slow load.
    document.getElementById("volume-btn").addEventListener("click", () => {
      const game = window.snowyBallsGame;
      if (!game) return;
      const nowMuted = !game.sound.mute;
      game.sound.mute = nowMuted;
      document.getElementById("volume-btn").classList.toggle("muted", nowMuted);
    });

    // SHOP <-> BACK: same button, label swaps. Click sound goes through Phaser so the mute
    // button and master volume apply to it too.
    document.getElementById("shop-btn").addEventListener("click", () => {
      playUiClick();
      const container = document.getElementById("game-container");
      const open = container.classList.toggle("shop-open");
      document.getElementById("shop-btn").textContent = open ? "BACK" : "SHOP";
      if (open) {
        Collection.close();
        const game = window.snowyBallsGame;
        const scene = game && game.scene.getScene("main");
        if (scene && scene.onShopOpened) scene.onShopOpened(); // drop an aim in progress
      }
      if (open && typeof Shop !== "undefined") Shop.onOpen();
    });
  </script>
</body>
</html>
